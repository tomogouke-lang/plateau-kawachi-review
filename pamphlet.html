<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>河内店 パンフレット確認用</title>
  <style>
    :root { color-scheme: light; --ink:#123f38; --paper:#f7f5ee; --line:#d9d4c7; --accent:#a95e3a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:#172b27; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; font-size:18px; line-height:1.7; }
    header { padding:32px 24px; background:var(--ink); color:white; }
    header div, main { width:min(1180px,100%); margin:auto; }
    h1 { margin:0 0 8px; font-size:clamp(28px,5vw,44px); line-height:1.25; }
    header p { margin:0; }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
    a { color:inherit; }
    nav a { display:inline-block; padding:10px 16px; border:2px solid white; border-radius:999px; text-decoration:none; font-weight:700; }
    main { padding:32px 16px 64px; }
    .notice { margin:0 0 28px; padding:18px 20px; background:white; border-left:8px solid var(--accent); border-radius:8px; }
    section { margin-top:32px; }
    h2 { color:var(--ink); font-size:clamp(24px,4vw,34px); margin:0 0 12px; }
    figure { margin:0; padding:12px; background:white; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(18,63,56,.08); }
    img { display:block; width:100%; height:auto; }
    figcaption { padding:10px 4px 0; font-weight:700; }
    footer { padding:24px; text-align:center; color:#51645f; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>河内店 三つ折りパンフレット確認用</h1>
      <p>Canva保存版の表面・中面を、ログインなしで確認できます。</p>
      <nav aria-label="関連ページ">
        <a href="./">一般向けLP</a>
        <a href="kawachi-caremanager.html">ケアマネジャー向けLP</a>
      </nav>
    </div>
  </header>
  <main>
    <p class="notice"><strong>確認用です。</strong> 文字、写真、料金、住所、電話番号、地図、QRコードをご確認ください。</p>
    <section>
      <h2>表面</h2>
      <figure><img src="pamphlet-outer.png" alt="河内店三つ折りパンフレットの表面"><figcaption>折りたたんだ際の表紙・裏表紙・折込面</figcaption></figure>
    </section>
    <section>
      <h2>中面</h2>
      <figure><img src="pamphlet-inner.png" alt="河内店三つ折りパンフレットの中面"><figcaption>開いた際の三面</figcaption></figure>
    </section>
  </main>
  <footer>プラトーケアセンター白山河内店｜確認用ページ</footer>
</body>
</html>
